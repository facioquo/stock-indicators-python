# Ref: https://jekyllrb.com/docs/usage/
# Local dev: bundle exec jekyll serve --livereload

title: Stock Indicators for Python
tagline: "Transform price quotes into trading insights."
repository: facioquo/stock-indicators-python
locale: en_US
baseurl: ""
url: "https://python.stockindicators.dev"

# social media information
image:
  path: /assets/social-banner.png
  height: 640
  width: 1280

logo: /assets/icons/android-chrome-192x192.png

# .NET site URL refs
dotnet:
  repo: "https://github.com/facioquo/stock-indicators-dotnet"
  src: "https://github.com/facioquo/stock-indicators-dotnet/blob/main/src"
  # The .NET docs moved to VitePress in v3.0.0 (896ae089), which deleted
  # docs/assets/charts and renamed the surviving images to kebab-case.
  # raw.githubusercontent does not follow repo renames, so the old
  # DaveSkender/Stock.Indicators URLs 404. Pinned to the last commit that
  # still carries the full PascalCase set — four of the images referenced
  # here (AdIndex, Correlation, HeikinAshi, StdDevChannelsFull) have no
  # equivalent in the current tree.
  charts: "https://raw.githubusercontent.com/facioquo/stock-indicators-dotnet/d0b99458e17505c32b966109b5e38979cd25c047/docs/assets/charts"

# this site URL refs
python:
  src: "https://github.com/facioquo/stock-indicators-python/blob/main/stock_indicators/indicators"

clarity: false

# site plugins and settings
plugins:
  - jekyll-github-metadata
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-last-modified-at
  - jekyll-redirect-from
  - jekyll-minifier

include:
  - _headers

exclude:
  [
    "*.lock",
    "*.yml",
    "*.pptx",
    ".offline",
    "docs/README.md",
    "docs/dx*",
    "Gemfile",
    "node_modules",
    "vendor",
  ]

permalink: pretty

defaults:
  - scope:
      path: "" # an empty string here means all files in the project
    values:
      layout: "base"
      image: /assets/social-banner.png

# page collections
collections:
  indicators:
    output: true
    permalink: /:path
    sort_by: "title"
