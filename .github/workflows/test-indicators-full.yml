# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Unit tests (full matrix)

on:
  push:
    branches: ["main"]
    paths:
      - stock_indicators/**
      - .github/workflows/test-indicators-full.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:

    strategy:
      matrix:
        include:
          # Primary testing on Ubuntu (free tier)
          - os: ubuntu-24.04-arm
            python-version: "3.8"
            dotnet-version: "8.0"
          - os: ubuntu-24.04-arm
            python-version: "3.10"
            dotnet-version: "9.0"
          - os: ubuntu-24.04-arm
            python-version: "3.12"
            dotnet-version: "10.0"
          - os: ubuntu-24.04-arm
            python-version: "3.13"
            dotnet-version: "11.0"

          # Essential platform compatibility testing (reduced matrix)
          - os: windows-2025
            python-version: "3.12"
            dotnet-version: "11.0"
          - os: macos-15
            python-version: "3.13"
            dotnet-version: "11.0"

          # Legacy support verification
          - os: ubuntu-22.04
            python-version: "3.8"
            dotnet-version: "8.0"

    runs-on: ${{ matrix.os }}
    name: "Py${{ matrix.python-version }}/.NET${{ matrix.dotnet-version }} on ${{ matrix.os }}"

    env:

      # identify configurations that post test reports
      POST_REPORT: ${{ matrix.os == 'ubuntu-24.04-arm' && matrix.dotnet-version == '11.0' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet-runtime
        with:
          version: ${{ matrix.dotnet-version }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -U --upgrade-strategy=only-if-needed pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Test indicators
        run: pytest -vr A tests --junitxml=test-results.xml

      - name: Post test summary
        uses: test-summary/action@v2
        if: env.POST_REPORT == 'true' && always()
        with:
          paths: test-results.xml
